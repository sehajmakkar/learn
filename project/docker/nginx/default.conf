# Nginx sits in front of the notes API and is the only container with a published port (see 05.05).
server {
    listen 80;

    # Docker's embedded DNS. Resolving per request means nginx starts even if the API isn't up yet,
    # and follows the API to its new IP when the container is replaced.
    resolver 127.0.0.11 valid=10s;
    set $api http://notes:3000;

    location / {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
