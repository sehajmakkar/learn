# Production: the published image, hardened containers, secrets from files (see 07.07).
# Deploy with ./deploy.sh, or: docker compose -f compose.prod.yaml up -d --wait
name: notes-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  proxy:
    # Same nginx config as development, but an image that runs as a non-root user.
    image: nginxinc/nginx-unprivileged:alpine
    ports:
      - "${PROXY_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks: [frontend]
    logging: *logging

  api:
    image: ${NOTES_API_IMAGE:-ghcr.io/sehajmakkar/notes-api:latest}
    environment:
      DATABASE_URL: postgres://notes@db:5432/notes
      DATABASE_PASSWORD_FILE: /run/secrets/db_password
      REDIS_URL: redis://cache:6379
    secrets: [db_password]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks: [frontend, backend]
    logging: *logging

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: notes
      POSTGRES_DB: notes
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    networks: [backend]
    logging: *logging

  cache:
    image: redis:8-alpine
    # A pure cache: nothing written to disk.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 96M
    networks: [backend]
    logging: *logging

networks:
  frontend:
  # The database and cache never need the internet.
  backend:
    internal: true

volumes:
  pgdata:

secrets:
  db_password:
    file: ./secrets/db_password.txt
