# The whole notes stack for local development: `docker compose up --watch` (see 06.06).
name: notes

services:
  proxy:
    image: nginx:alpine
    ports:
      - "${PROXY_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [frontend]
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ./api
      target: dev
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-notes}:${POSTGRES_PASSWORD:-notes}@db:5432/${POSTGRES_DB:-notes}
      REDIS_URL: redis://cache:6379
      MAX_NOTE_LENGTH: ${MAX_NOTE_LENGTH:-280}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [frontend, backend]
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    develop:
      watch:
        # Source edits are copied into the running container; node --watch restarts the server.
        - action: sync
          path: ./api/src
          target: /app/src
        # New dependencies need a new image.
        - action: rebuild
          path: ./api/package.json

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-notes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notes}
      POSTGRES_DB: ${POSTGRES_DB:-notes}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  cache:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [backend]

  # Optional database UI: docker compose --profile tools up (see 06.04).
  adminer:
    image: adminer
    profiles: [tools]
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    networks: [backend]
    depends_on: [db]

networks:
  frontend:
  backend:

volumes:
  pgdata:
